name: Build Miqati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Miqati_Android_New_Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
     
      - name: Extract Miqati project
        run: |
          mkdir -p project
          unzip -o Miqati_Android_New_Starter.zip -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        run: |
          if [ ! -f project/settings.gradle.kts ]; then
            echo "Searching for Gradle project..."
            SETTINGS=$(find project -name settings.gradle.kts -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle.kts not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            PROJECT_DIR="project"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Gradle file
        run: |
          echo "Checking app/build.gradle.kts"
          find "$PROJECT_DIR" -name build.gradle.kts -print

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

      - name: Build Miqati APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Miqati APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Miqati-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk 
          if-no-files-found: error
